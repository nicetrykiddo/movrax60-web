<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#120e0c" />
    <meta
      name="description"
      content="Meet movrax60, an international cybersecurity capture the flag team. Explore the players and their competition highlights."
    />
    <title>movrax60 — International CTF team</title>
    <link rel="icon" href="/mascot.png" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body class="home" id="top">
    <a class="skip" href="#main">Skip to content</a>
    <!-- header -->
    <main id="main">
      <section
        class="hero story-scene"
        id="identity"
        aria-labelledby="hero-title"
        data-cue="0"
      >
        <!-- opening -->
        <div class="scene-copy hero-copy">
          <p class="kicker"><i></i> International CTF team</p>
          <h1 id="hero-title">movrax<span>60</span></h1>
          <p class="lede">
            We compete in cybersecurity<br />capture the flag events.
          </p>
          <div class="actions">
            <a class="button" href="/members/"
              >Meet the team <b aria-hidden="true">↗</b></a
            ><a class="text-link" href="#results"
              >Our results <b aria-hidden="true">↓</b></a
            >
          </div>
        </div>
        <a class="scroll-cue" href="#team"
          ><i aria-hidden="true"></i> Scroll to enter</a
        >
      </section>
      <section
        class="crew story-scene reverse"
        id="team"
        aria-labelledby="crew-title"
        data-cue="89"
      >
        <!-- roster scene -->
        <div class="scene-copy">
          <p class="kicker"><i></i> Members</p>
          <h2 id="crew-title">Behind<br />the handles<span>.</span></h2>
          <p class="lede">The players behind movrax60.</p>
          <a class="button" href="/members/"
            >Explore the roster <b aria-hidden="true">↗</b></a
          >
        </div>
      </section>
      <section
        class="spotlight story-scene"
        id="results"
        aria-labelledby="highlight-title"
        data-cue="138"
      >
        <!-- spotlight -->
      </section>
      <!-- results -->
      <!-- contact -->
    </main>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
