<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#131617" />
    <meta
      name="description"
      content="Meet movrax60, an international cybersecurity capture the flag team. Explore the players and their competition highlights."
    />
    <title>movrax60 — International CTF team</title>
    <link rel="icon" href="/mascot.png" />
    <link rel="preload" as="image" href="/pin/000.webp" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body class="home" id="top">
    <a class="skip" href="#main">Skip to content</a>
    <!-- header -->
    <main id="main">
      <div class="runway">
        <div class="stage" aria-hidden="true">
          <div class="stage-light"></div>
          <div class="pin-position">
            <img
              id="pin"
              src="/pin/000.webp"
              width="960"
              height="960"
              alt=""
              fetchpriority="high"
            />
          </div>
        </div>
        <section
          class="hero page-section"
          id="identity"
          aria-labelledby="hero-title"
        >
          <div class="hero-main">
            <p class="kicker"><i></i> International CTF team</p>
            <h1 id="hero-title">movrax<span>60</span></h1>
            <p class="hero-deck">
              An international cybersecurity<br />capture the flag team.
            </p>
            <div class="actions">
              <a class="button" href="/members/"
                >Meet the team <b aria-hidden="true">↗</b></a
              ><a class="text-link" href="#results"
                >Our results <b aria-hidden="true">↓</b></a
              >
            </div>
          </div>
          <button
            class="pin-control"
            hidden
            aria-label="Turn the mascot pin"
            type="button"
          >
            <span aria-hidden="true">↻</span> Turn the pin
          </button>
          <div class="hero-foot">
            <a href="#team"
              ><span class="scroll-line" aria-hidden="true"></span> Scroll to
              explore</a
            ><span>Capture the flag <i>/</i> movrax60</span>
          </div>
        </section>
      </div>
      <section
        class="crew story-scene reverse page-section"
        id="team"
        aria-labelledby="crew-title"
      >
        <!-- roster scene -->
        <div class="crew-copy scene-copy">
          <p class="kicker"><i></i> Members</p>
          <h2 id="crew-title">Behind<br />the handles<span>.</span></h2>
          <p class="lede">Eight players. One team.</p>
          <a class="button" href="/members/"
            >Explore the roster <b aria-hidden="true">↗</b></a
          >
        </div>
        <div class="handle-strip" aria-label="Team roster">
          <!-- handle strip -->
        </div>
      </section>
      <section
        class="spotlight story-scene page-section"
        id="results"
        aria-labelledby="highlight-title"
      >
        <!-- spotlight -->
      </section>
      <!-- results -->
      <!-- contact -->
    </main>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
