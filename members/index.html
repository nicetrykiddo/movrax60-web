<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#120e0c" />
    <meta
      name="description"
      content="Meet the movrax60 members and explore their public CTF profiles."
    />
    <title>Members — movrax60</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body class="directory" id="top">
    <a class="skip" href="#main">Skip to content</a>
    <!-- header -->
    <main id="main">
      <section
        class="roster-intro story-scene reverse"
        aria-labelledby="roster-title"
        data-cue="89"
      >
        <div class="scene-copy">
          <p class="kicker"><i></i> movrax60 / Members</p>
          <h1 id="roster-title">The roster<span>.</span></h1>
          <p class="lede">The eight handles on our CTFtime team sheet.</p>
          <a class="button" href="#players"
            >Browse players <b aria-hidden="true">↓</b></a
          >
        </div>
      </section>
      <section
        class="member-directory"
        id="players"
        aria-label="Player profiles"
      >
        <aside class="member-stage">
          <div class="plate-rack">
            <!-- player plates -->
            <button
              class="plate-step previous"
              type="button"
              aria-label="Previous player"
              hidden
            >
              ←
            </button>
            <button
              class="plate-step next"
              type="button"
              aria-label="Next player"
              hidden
            >
              →
            </button>
          </div>
          <nav class="player-index" aria-label="Choose a player">
            <!-- player index -->
          </nav>
        </aside>
        <div class="players"><!-- members --></div>
      </section>
      <!-- contact -->
    </main>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
